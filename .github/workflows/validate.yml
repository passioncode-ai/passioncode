name: validate

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag whose source must be validated
        required: false
        type: string

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  # PC-132: macOS, where the apps install, runs the whole gate as Linux does (the suite's fake codesign and hdiutil
  # stand in for the real ones there too).
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  # PC-85 and PC-86 are Windows defects: their tests run on Windows itself, where `current` is
  # replaced by the real rename that failed on the tester's machine (2026-10-28).
  # PC-135: the whole gate runs here as on Linux and macOS. Cases that cannot run on Windows skip by name with
  # their reason (AGENTS.md lists them): POSIX links, paths and modes, signals, an unwritable folder,
  # setup.test.js's macOS simulation, and the reg-simulated PC-86/88/89 doctor and setup cases (shell-script stand-ins).
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

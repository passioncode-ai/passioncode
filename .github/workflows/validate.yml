name: validate

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag whose source must be validated
        required: false
        type: string

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

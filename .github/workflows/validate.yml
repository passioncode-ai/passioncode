name: validate

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag whose source must be validated
        required: false
        type: string

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  # PC-85 and PC-86 are Windows defects: their tests run on Windows itself, where `current` is
  # replaced by the real rename that failed on the tester's machine (2026-10-28).
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/windows.test.js
      # PC-99: six tests that spawn nothing run here too, so a Windows
      # checkout is proved to read as on Linux and macOS. The rest of the suite is not yet proved
      # on Windows: most of it drives fake tools (a Node claude run through its
      # shebang line, and shell-script codesign and hdiutil).
      - run: node --test test/no-em-dash.test.js test/license.test.js test/skill.test.js test/docs.test.js test/openpgp.test.js test/pack-result.test.js
